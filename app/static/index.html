<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Secure Volunteer Portal</title>
    <style>
        /* Mantenemos exactamente tus estilos originales */
        body { font-family: sans-serif; max-width: 400px; margin: 40px auto; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
        .hidden { display: none; }
        .error { color: red; }
        .success { color: green; }
        
        /* Estilos adicionales SOLO para los botones de navegación */
        .nav-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-buttons button { flex: 1; cursor: pointer; background-color: #f0f0f0; border: 1px solid #ccc; }
        .nav-buttons button:hover { background-color: #e0e0e0; }
    </style>
</head>
<body>
    <!-- Botones principales para elegir qué hacer -->
    <div class="nav-buttons" id="nav-menu">
        <button onclick="showSection('register-section')">Register</button>
        <button onclick="showSection('login-section')">Login</button>
    </div>

    <!-- FORMULARIO DE REGISTRO (Oculto por defecto) -->
    <div id="register-section" class="hidden">
        <h2>Register</h2>
        <input type="email" id="reg-email" placeholder="Email">
        <input type="password" id="reg-password" placeholder="Password">
        <button onclick="register()">Enter</button>
        <p id="reg-result"></p>

        <!-- Panel que se muestra después de un registro exitoso -->
        <div id="mfa-setup" class="hidden">
            <h3>Scan this in your Authenticator App</h3>
            <p>Secret: <strong id="totp-secret"></strong></p>
            <p><small>URI: <span id="otpauth-uri"></span></small></p>
        </div>
    </div>

    <!-- FORMULARIO DE LOGIN (Oculto por defecto) -->
    <div id="login-section" class="hidden">
        <h2>Login</h2>
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Password">
        <button onclick="login()">Enter</button>
        
        <!-- Panel que se muestra después de validar la contraseña -->
        <div id="mfa-verify" class="hidden">
            <input type="text" id="totp-code" placeholder="6-digit Code">
            <button onclick="verifyMfa()">Enter</button>
        </div>
        <p id="login-result"></p>
    </div>

    <!-- Vinculación con el JS -->
    <script src="/static/app.js"></script>
</body>
</html>
