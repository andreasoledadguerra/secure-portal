<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Secure Portal</title>

    <link rel="preconnect" href="http://fonts.googleapis.com">
    <link rel="preconnect" href="http://fonts.googleapis.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400; 500;600&display=swap" rel="stylesheet">


    <style>
        body { 
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            font-size: 15px;
            line-height: 1.6;
            letter-spacing: -0.01em;
            color: #1a1a1a;
            max-width: 400px; 
            margin: 40px auto;
            -webkit-font-smoothing: antialiased;
        }
        h2, h3 { margin-bottom: 600; letter-spacing: -0.02em; }
        input, button { 
            font-family: inherit;
            font-size: inherit;
            width: 100%; 
            padding: 10px; 
            margin: 5px 0; 
            box-sizing: border-box; 
        }
        button  { font-weight: 500; cursor: pointer;}
        .hidden { display: none; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>

<body>
    <h2>Register</h2>
    <div id="register-section">
        <input type="email" id="reg-email" placeholder="Email">
        <input type="password" id="reg-password" placeholder="Password">
        <button onclick="register()">Register</button>
        <p id="reg-result"></p>
    </div>

    <div id="mfa-setup" class="hidden">
        <h3>Scan this code in your authentication app</h3>
        <p>Secreto: <strong id="totp-secret"></strong></p>
        <p><small>O usa la URL: <span id="otpauth-uri"></span></small></p>
        <button onclick="showLogin()">Ir al Login</button>
    </div>

    <h2 id="login-title">Login</h2>
    <div id="login-section">
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Password">
        <button onclick="login()">Login</button>
        <div id="mfa-verify" class="hidden">
            <input type="text" id="totp-code" placeholder="6-digit Code">
            <button onclick="verifyMfa()">Verify Code</button>
        </div>
        <p id="login-result"></p>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
